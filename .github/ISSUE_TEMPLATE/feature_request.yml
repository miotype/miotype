name: Feature request
description: Something MioType should do
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: Describe the situation, not only the solution. "When I dictate a shell command, ..." helps more than "add X".
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would help
